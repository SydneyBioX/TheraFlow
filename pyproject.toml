[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theraflow"
version = "1.0.0"
description = "A Multi-Stage Framework for Evaluating Generative Drug Models from Transcriptomics and Prioritizing Candidates"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.20.0",
    "scipy>=1.9.0",
    "joblib>=1.2.0",
    "tqdm>=4.64.0",
    "chembl-webresource-client>=0.10.8",
    "posebusters>=0.2.0",
    "rdkit",
    "selfies>=2.1.0",
    "requests>=2.28.0"
]

[project.scripts]
theraflow = "run_pipeline:main"

[tool.setuptools]
py-modules = ["run_pipeline"]

[tool.setuptools.package-data]
"*" = ["*.R"]
